name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # This project has no committed gradlew wrapper, so pin the Gradle version the
    # project is developed against instead of using whatever the runner ships with.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # The release build type is signed with the "upload" key from KEYSTORE_PATH. Restore
    # the real upload keystore from the RELEASE_KEYSTORE_BASE64 secret, which is stored as
    # `base64 -w0 my-upload-key.jks`. The keystore must use the alias "upload", because
    # app/build.gradle.kts signs with that alias.
    #
    # Releases on main/master must be signed with the real key, otherwise users could not
    # install the update over an existing install. Pull requests only verify that the
    # minified build compiles, so they fall back to a throwaway key instead of failing.
    - name: Prepare Release Keystore
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        IS_RELEASE_BRANCH=false
        if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
          IS_RELEASE_BRANCH=true
        fi

        if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
          if [ -z "$RELEASE_STORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is set, but RELEASE_STORE_PASSWORD and/or RELEASE_KEY_PASSWORD are missing."
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > ci-release.keystore
          echo "Using the upload keystore from RELEASE_KEYSTORE_BASE64"
          echo "RELEASE_KEYSTORE_PATH=$PWD/ci-release.keystore" >> "$GITHUB_ENV"
          exit 0
        fi

        if [ "$IS_RELEASE_BRANCH" = "true" ]; then
          echo "::error::RELEASE_KEYSTORE_BASE64 is not set. Releases from main/master must be signed with the upload key."
          exit 1
        fi

        echo "::warning::RELEASE_KEYSTORE_BASE64 is not set, so this build is signed with a throwaway key. The APK installs but cannot update an existing install."
        keytool -genkeypair -v \
          -keystore ci-release.keystore \
          -storepass ci-fallback \
          -alias upload \
          -keypass ci-fallback \
          -keyalg RSA -keysize 2048 -validity 10000 \
          -dname "CN=CI Fallback, O=Nexus Launcher, C=US"
        echo "RELEASE_KEYSTORE_PATH=$PWD/ci-release.keystore" >> "$GITHUB_ENV"

    - name: Build Release APK
      env:
        KEYSTORE_PATH: ${{ env.RELEASE_KEYSTORE_PATH }}
        STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'ci-fallback' }}
        KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'ci-fallback' }}
        GOOGLE_TV_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_ID }}
        GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
      run: gradle -Djava.awt.headless=true assembleRelease

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: nexus-launcher-release
        path: app/build/outputs/apk/release/app-release.apk
        if-no-files-found: error

    # R8 renames classes, so the mapping file is what makes release stack traces readable.
    - name: Upload R8 Mapping
      uses: actions/upload-artifact@v4
      with:
        name: nexus-launcher-release-mapping
        path: app/build/outputs/mapping/release/mapping.txt
        if-no-files-found: warn

    # Auto tag the next patch release and publish a GitHub Release on push to master/main
    - name: Create Release and Tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Find latest semver tag vX.Y.Z
        LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
        if [ -z "$LATEST_TAG" ]; then
          # Fallback to the app's initial version
          NEW_TAG="v1.0.1"
        else
          # Extract major, minor, patch
          CLEAN_TAG="${LATEST_TAG#v}"
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEW_TAG="v${MAJOR}.${MINOR}.${NEW_PATCH}"
        fi

        echo "Computed next release tag: $NEW_TAG"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        git push origin "$NEW_TAG"

        APK_PATH="app/build/outputs/apk/release/app-release.apk"
        RELEASE_APK="NexusLauncher-${NEW_TAG}.apk"
        cp "$APK_PATH" "$RELEASE_APK"

        gh release create "$NEW_TAG" "$RELEASE_APK" \
          --title "Nexus Launcher $NEW_TAG" \
          --notes "Automatic release $NEW_TAG built from commit $(git rev-parse --short HEAD)."
