name: Build Android App

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    # This project has no committed gradlew wrapper, so pin the Gradle version the
    # project is developed against instead of using whatever the runner ships with.
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '9.3.1'

    # Restore the debug keystore from the repository's base64 encoded debug keystore
    # This guarantees consistent signing across all CI builds and avoids INSTALL_FAILED_UPDATE_INCOMPATIBLE
    - name: Restore Debug Keystore
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
        elif [ ! -f "debug.keystore" ]; then
          echo "debug.keystore.base64 not found, generating fallback keystore"
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    # Write build-time secrets into .env for secrets-gradle-plugin (it reads .env, not OS env vars)
    - name: Configure Build Secrets
      env:
        GOOGLE_TV_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_ID }}
        GOOGLE_TV_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_TV_OAUTH_CLIENT_SECRET }}
      run: |
        : > .env
        if [ -n "$GOOGLE_TV_OAUTH_CLIENT_ID" ]; then
          printf 'GOOGLE_TV_OAUTH_CLIENT_ID=%s\n' "$GOOGLE_TV_OAUTH_CLIENT_ID" >> .env
        fi
        if [ -n "$GOOGLE_TV_OAUTH_CLIENT_SECRET" ]; then
          printf 'GOOGLE_TV_OAUTH_CLIENT_SECRET=%s\n' "$GOOGLE_TV_OAUTH_CLIENT_SECRET" >> .env
        fi

    # Determine the semantic version for this build before Gradle runs so BuildConfig
    # and AndroidManifest embed the exact version matching the release tag.
    - name: Compute Semantic Version
      run: |
        LATEST_TAG=$(git tag -l "v*.*.*" | sort -V | tail -n 1)
        if [ -z "$LATEST_TAG" ]; then
          BASE_VER=$(sed -nE 's/.*orElse\("([0-9]+\.[0-9]+\.[0-9]+)"\).*/\1/p' app/build.gradle.kts | head -n 1)
          BASE_VER=${BASE_VER:-1.0.76}
          LATEST_TAG="v${BASE_VER}"
        fi

        CLEAN_TAG="${LATEST_TAG#v}"
        if [ "${{ github.event_name }}" = "push" ] && { [ "${{ github.ref }}" = "refs/heads/main" ] || [ "${{ github.ref }}" = "refs/heads/master" ]; }; then
          MAJOR=$(echo "$CLEAN_TAG" | cut -d. -f1)
          MINOR=$(echo "$CLEAN_TAG" | cut -d. -f2)
          PATCH=$(echo "$CLEAN_TAG" | cut -d. -f3)
          NEW_PATCH=$((PATCH + 1))
          NEXT_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          NEW_TAG="v${NEXT_VERSION}"
        else
          NEXT_VERSION="$CLEAN_TAG"
          NEW_TAG="$LATEST_TAG"
        fi

        echo "Computed semantic version: $NEXT_VERSION (tag: $NEW_TAG)"
        echo "APP_VERSION_NAME=$NEXT_VERSION" >> "$GITHUB_ENV"
        echo "NEW_TAG=$NEW_TAG" >> "$GITHUB_ENV"

    # Execute the build directly using the Gradle installed by setup-gradle
    - name: Build with Gradle
      run: gradle -Djava.awt.headless=true assembleDebug -PappVersionName="$APP_VERSION_NAME"

    - name: Clean Build Secrets
      if: always()
      run: rm -f .env

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: nexus-launcher-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    # Auto tag the next patch release and publish a GitHub Release on push to master/main
    - name: Create Release and Tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "Publishing release tag: $NEW_TAG (version $APP_VERSION_NAME)"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
        git push origin "$NEW_TAG"

        APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
        RELEASE_APK="NexusLauncher-${NEW_TAG}.apk"
        cp "$APK_PATH" "$RELEASE_APK"

        gh release create "$NEW_TAG" "$RELEASE_APK" \
          --title "Nexus Launcher $NEW_TAG" \
          --notes "Automatic release $NEW_TAG built from commit $(git rev-parse --short HEAD)."
